# =============================================================================
# Network Ontology — Symptom Signatures
# =============================================================================
# Pre-computed pattern matching: "this combination of symptoms = that fault."
# Replaces LLM reasoning about what symptoms mean.

signatures:

  ran_failure:
    diagnosis: "N2 connectivity loss — RAN/gNB unreachable, radio access lost"
    failure_domain: ran
    confidence: very_high
    match_all:
      - metric: ran_ue
        condition: "= 0"
      - metric: gnb
        condition: "= 0"
    match_any:
      - metric: sm_sessionnbr
        condition: "> 0"
        note: "stale sessions from before failure"
    rule_out:
      - tool: measure_rtt
        args: {container: "amf", target_ip: "172.22.0.23"}
        check: "100% packet loss confirms gNB unreachable"
      - tool: get_nf_metrics
        check: "Confirm ran_ue and gnb both at 0"
    related_chain: n2_connectivity_loss

  data_plane_degradation:
    diagnosis: "N3 data plane degradation — packet loss or latency on GTP-U path"
    failure_domain: data_plane
    confidence: high
    match_any:
      - log_pattern: ue_jitter_buffer_reset
      - metric: gtp_indatapktn3upf
        condition: "incrementing erratically (delta much smaller than expected)"
      - metric: gtp_outdatapktn3upf
        condition: "incrementing erratically"
    match_all:
      - metric: upf_sessionnbr
        condition: "> 0"
        note: "sessions exist — data plane not completely dead"
    rule_out:
      - tool: measure_rtt
        args: {container: "nr_gnb", target_ip: "172.22.0.8"}
        check: "Elevated RTT or packet loss confirms transport issue on N3 path"
      - tool: get_nf_metrics
        check: "Compare GTP counter rates to baseline"
    related_chain: n3_data_plane_degradation

  data_plane_dead:
    diagnosis: "N3 data plane outage — no GTP-U traffic flowing"
    failure_domain: data_plane
    confidence: very_high
    match_all:
      - metric: gtp_indatapktn3upf
        condition: "= 0 or stopped incrementing"
      - metric: gtp_outdatapktn3upf
        condition: "= 0 or stopped incrementing"
      - metric: upf_sessionnbr
        condition: "> 0"
        note: "sessions exist but no traffic = zombied tunnels"
    rule_out:
      - tool: measure_rtt
        args: {container: "nr_gnb", target_ip: "172.22.0.8"}
        check: "Check N3 path reachability"
      - tool: get_nf_metrics
        check: "If ran_ue is also 0, root cause is N2 loss (RAN failure), not UPF issue"
    related_chain: n3_data_plane_outage

  ims_hss_failure:
    diagnosis: "IMS HSS unreachable — Diameter Cx queries failing"
    failure_domain: ims_signaling
    confidence: high
    match_any:
      - metric: "cdp:timeout"
        condition: "> 0"
        at: [icscf, scscf]
      - metric: "ims_icscf:uar_timeouts"
        condition: "> 0"
      - metric: "ims_auth:mar_timeouts"
        condition: "> 0"
    match_all:
      - metric: "ims_usrloc_pcscf:registered_contacts"
        condition: "dropping or = 0"
        note: "existing registrations expiring"
    rule_out:
      - tool: run_kamcmd
        args: {container: "icscf", command: "cdp.list_peers"}
        check: "Diameter peer state — confirms HSS connectivity issue"
      - tool: measure_rtt
        args: {container: "icscf", target_ip: "172.22.0.18"}
        check: "Check basic connectivity to HSS"
    related_chain: hss_unreachable

  ims_scscf_unreachable:
    diagnosis: "S-CSCF unreachable — IMS registration and call control stopped"
    failure_domain: ims_signaling
    confidence: high
    match_any:
      - log_pattern: icscf_500_lir
    match_all:
      - metric: "ims_usrloc_scscf:active_contacts"
        condition: "= 0 or stale"
    rule_out:
      - tool: measure_rtt
        args: {container: "icscf", target_ip: "172.22.0.20"}
        check: "Check connectivity from I-CSCF to S-CSCF"
      - tool: get_network_status
        check: "Check S-CSCF process/container health"
    related_chain: scscf_unreachable

  ims_signaling_partition:
    diagnosis: "IMS SIP signaling path severed — network partition between P-CSCF and I/S-CSCF"
    failure_domain: ims_signaling
    confidence: high
    match_all:
      - metric: "tmx:active_transactions"
        condition: "> 0"
        at: pcscf
        note: "transactions accumulating with no response"
    match_any:
      - log_pattern: sip_408_timeout
        at: pcscf
    rule_out:
      - tool: measure_rtt
        args: {container: "pcscf", target_ip: "172.22.0.19"}
        check: "100% loss to I-CSCF confirms partition"
      - tool: measure_rtt
        args: {container: "pcscf", target_ip: "172.22.0.20"}
        check: "100% loss to S-CSCF confirms partition"
    related_chain: ims_partition

  sip_transport_mismatch:
    diagnosis: "SIP transport protocol mismatch — TCP/UDP incompatibility"
    failure_domain: ims_signaling
    confidence: medium
    match_all:
      - log_pattern: icscf_500_lir
        note: "500 error but Diameter is actually working"
    match_any:
      - observation: "SIP INVITE sent by one node but never received by next hop"
      - observation: "Large SIP messages fail, small ones succeed"
    rule_out:
      - tool: read_running_config
        args: {container: "pcscf", grep: "udp_mtu_try_proto"}
        check: "If set to TCP, large SIP messages switch to TCP"
      - tool: check_process_listeners
        args: {container: "e2e_ue2"}
        check: "If UE only listens on UDP, TCP delivery fails silently"
    related_chain: tcp_udp_mismatch

  infrastructure_dns_down:
    diagnosis: "DNS server down — IMS domain resolution broken"
    failure_domain: infrastructure
    confidence: very_high
    match_all:
      - container_status: {dns: exited}
    match_any:
      - log_pattern: "DNS lookup error"
        at: [pcscf, icscf, scscf]
    rule_out:
      - tool: get_network_status
        check: "dns container status"
    related_chain: dns_failure

  infrastructure_mongodb_down:
    diagnosis: "MongoDB down — 5G subscriber data unavailable"
    failure_domain: infrastructure
    confidence: very_high
    match_all:
      - container_status: {mongo: exited}
    match_any:
      - log_pattern: "MongoDB connection error"
        at: [udr]
    rule_out:
      - tool: get_network_status
        check: "mongo container status"
    related_chain: mongodb_gone

  ims_signaling_chain_degraded:
    diagnosis: >
      IMS signaling chain degraded — one or more components on the IMS path
      (P-CSCF, I-CSCF, S-CSCF, HSS) is slow, overloaded, or broken. Active
      probing required to pinpoint the bottleneck.
    failure_domain: ims_signaling
    confidence: high
    match_any:
      - metric: "core:rcv_requests_register"
        condition: "rate anomalously high (retransmission storm)"
        at: pcscf
      - metric: "tmx:active_transactions"
        condition: "> 0"
        at: [pcscf, icscf, scscf]
      - log_pattern: sip_408_timeout
        at: [pcscf, e2e_ue1, e2e_ue2]
      - metric: "cdp:timeout"
        condition: "> 0"
        at: [icscf, scscf]
        note: >
          Diameter timeout can be caused by HSS failure OR by upstream
          IMS component latency/failure. Do NOT assume HSS is the root
          cause without probing each component.
    hypotheses:
      - name: "Transport latency on one IMS component"
        test: >
          Run measure_rtt FROM each IMS component to its neighbors.
          The component with elevated egress RTT (>10ms) is the bottleneck.
        tools: [measure_rtt]
      - name: "Application-level hang or overload on one IMS component"
        test: >
          If all RTTs are normal, check process health and logs on each
          component showing elevated tmx:active_transactions or timeouts.
        tools: [check_process_listeners, read_container_logs, run_kamcmd]
      - name: "HSS specifically unreachable"
        test: >
          If cdp:timeout is elevated but pcscf register_rate is normal,
          HSS may be genuinely unreachable. Check measure_rtt from icscf
          to pyhss, and check pyhss process state and logs.
        tools: [measure_rtt, read_container_logs, check_process_listeners]
      - name: "Database backend slow"
        test: >
          If HSS is reachable but Diameter response times are elevated,
          the MySQL backend may be slow. Check pyhss logs for query delays.
        tools: [read_container_logs]
    related_chain: ims_signaling_chain_degraded

  # =========================================================================
  # CDR-0001 NOVEL SIGNATURES (added 2026-06-05)
  # =========================================================================

  asymmetric_path:
    diagnosis: "Asymmetric path degradation — loss/latency in one direction only between two NFs"
    failure_domain: transport
    confidence: high
    match_all:
      - probe: "measure_rtt(source=A, dest=B)"
        condition: "loss > 10% OR rtt > expected_baseline + 50ms"
      - probe: "measure_rtt(source=B, dest=A)"
        condition: "loss < 5% AND rtt within baseline"
    rule_out:
      - tool: read_container_logs
        check: "Confirm one side declares SCTP/TCP association DOWN while the other reports it UP"
    related_chain: asymmetric_path_degradation
    note: "The discriminating signal is divergence between bidirectional probes — symmetric reachability assumptions FAIL here. Both endpoints must be probed."

  selective_subscriber_failure:
    diagnosis: "Subscriber data corruption — per-IMSI authentication failure with healthy aggregate metrics"
    failure_domain: subscriber_data
    confidence: very_high
    match_all:
      - log_pattern: "MAC failure"
        at: amf
      - condition: "Same IMSI repeated across multiple AKA failure log lines"
      - metric: ran_ue
        condition: "< expected_baseline (oscillating)"
      - metric: ims_usrloc_pcscf:registered_contacts
        condition: "< expected_baseline by exactly 1"
    rule_out:
      - tool: query_subscriber
        check: "Compare K/OPC field for failing IMSI vs. a known-working IMSI — divergence confirms"
      - tool: get_nf_metrics
        check: "pyhss container health green, no NF-wide auth-rate anomaly — confirms it's NOT a PyHSS outage"
    related_chain: subscriber_data_corruption
    note: "SELECTIVE failure — one UE breaks, others work. Aggregate counters may NOT cross screener thresholds. Per-IMSI comparison is the diagnostic."

  pmtu_blackhole_n3:
    diagnosis: "PMTU black-hole on the data plane — small packets pass, large packets silently dropped"
    failure_domain: data_plane
    confidence: high
    match_all:
      - probe: "get_dp_quality_gauges"
        condition: "voice (small-RTP) MOS and loss_ratio at baseline"
      - metric: fivegs_ep_n3_gtp_indatapktn3upf
        condition: "still incrementing (small packets are flowing)"
    match_any:
      - log_pattern: "Request Timeout|408"
        at: pcscf
        condition: "new SIP INVITE transactions timing out"
      - condition: "New PDU Session Establishment never completes (large NAS Accept dropped)"
        at: amf
    rule_out:
      - tool: measure_rtt
        check: "Small ICMP packets succeed — rules out partition and pure loss"
    related_chain: pmtu_blackhole
    note: "SIZE-DEPENDENT failure. Discriminator vs. partition: small packets pass. Discriminator vs. uniform loss: voice unaffected. Discriminator vs. latency: no delay, just silent drop above ~1240 B."

  clock_drift_observability_only:
    diagnosis: "Observability-only clock drift — one NF's wall clock differs from peers; no functional impact"
    failure_domain: infrastructure / observability
    confidence: high
    match_all:
      - probe: "shell(container=X, cmd='date +%s')"
        condition: "delta vs host or peer NFs > 300 seconds"
      - metric: ran_ue
        condition: "at expected baseline"
      - metric: amf_session
        condition: "at expected baseline"
      - metric: ims_usrloc_pcscf:registered_contacts
        condition: "at expected baseline"
    rule_out:
      - tool: get_nf_metrics
        check: "All FUNCTIONAL metrics steady — only timestamp-derived rates may look anomalous"
      - tool: read_container_logs
        check: "No auth failures, no Diameter timeouts, no SIP rejections — confirms benign drift"
    related_chain: observability_clock_drift
    note: |
      NEGATIVE-CONTROL signature. The correct diagnosis under this
      pattern is 'no functional fault detected; clock-drift observability
      anomaly on <NF>.' Diagnosing a functional outage on this signature
      is a FALSE POSITIVE — the agent must distinguish benign noise from
      real fault. See CDR-0001 §1 for the verification that established
      this is observability-only in the current lab.
